<svg xmlns="http://www.w3.org/2000/svg" viewBox="85 36 230 260" width="100%" height="100%">
  <!--
    Favicon de INNOVER: el icono del logo, sin la palabra.

    El viewBox "85 36 230 260" encuadra solo el icono. El SVG original
    mide 400x420 y lleva la palabra "Innover" debajo; en una pestaña de
    16 px esa palabra sería una mancha de dos píxeles de alto.

    Aquí no hay filtro de sombra —el original lo trae— porque a este
    tamaño no se ve y algunos renderizadores de favicons lo ignoran o lo
    pintan mal. Las formas sí son las mismas que en
    `src/components/Logo.tsx`: si cambia una, cambia la otra.
  -->
  <defs>
    <linearGradient id="azul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#0082FF" />
    </linearGradient>
    <linearGradient id="turquesa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B8" />
      <stop offset="100%" stop-color="#008B9B" />
    </linearGradient>
  </defs>

  <!-- Base del mapa 3D -->
  <path d="M 95 232 L 200 282 L 305 232 L 305 242 L 200 292 L 95 242 Z" fill="#10316B" />
  <path d="M 90 218 L 200 270 L 310 218 L 310 230 L 200 282 L 90 230 Z" fill="#CBD5E1" />
