<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <!-- Gradiente Izquierdo (Azul profundo a Azul brillante) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#0082FF" />
    </linearGradient>

    <!-- Gradiente Derecho (Turquesa a Cian) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B8" />
      <stop offset="100%" stop-color="#008B9B" />
    </linearGradient>

    <!-- Sombra suave para el pin y el mapa -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1A3E62" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- ================= BASE DEL MAPA 3D ================= -->
  <g filter="url(#dropShadow)">
    <!-- Borde inferior azul oscuro (Base profunda) -->
    <path d="M 95 232 L 200 282 L 305 232 L 305 242 L 200 292 L 95 242 Z" fill="#10316B" />
    
    <!-- Grosor intermedio blanco/gris de la plataforma -->
    <path d="M 90 218 L 200 270 L 310 218 L 310 230 L 200 282 L 90 230 Z" fill="#CBD5E1" />
    
    <!-- Superficie superior del mapa (Rombo isométrico) -->
    <polygon points="200,168 310,218 200,270 90,218" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="3" />

    <!-- Parcelas / Calles del mapa (Izquierda - Tonos Azules/Grises) -->
    <polygon points="194,178 145,200 175,214 222,191" fill="#CBD5E1" />
    <polygon points="135,205 105,218 138,234 168,219" fill="#3898FF" />
    <polygon points="175,223 146,238 195,261 224,246" fill="#5CA8FF" />

    <!-- Parcelas / Parques del mapa (Derecha - Tonos Verdes/Turquesas) -->
    <polygon points="230,195 183,218 215,233 262,210" fill="#86CFA3" />
    <polygon points="270,214 223,237 245,247 292,224" fill="#74B896" />
    <polygon points="215,241 198,249 218,258 235,250" fill="#5BB5A2" />
  </g>

  <!-- ================= PIN HEXAGONAL Y CASA 3D ================= -->
  <g filter="url(#dropShadow)">
    <!-- Fondo blanco interno del pin para dar contraste limpio -->
    <polygon points="200,52 268,90 268,162 200,238 132,162 132,90" fill="#FFFFFF" />

    <!-- Mitad Izquierda del Escudo/Pin Exterior (Azul) -->
    <path d="M 200 42 
             L 136 78 
             A 16 16 0 0 0 128 92 
             L 128 156 
             A 22 22 0 0 0 135 172 
             L 200 245 
             L 200 216 
             L 150 160 
             L 150 96 
             L 200 68 Z" fill="url(#blueGrad)" />

    <!-- Mitad Derecha del Escudo/Pin Exterior (Turquesa) -->
    <path d="M 200 42 
             L 264 78 
             A 16 16 0 0 1 272 92 
             L 272 156 
             A 22 22 0 0 1 265 172 
             L 200 245 
             L 200 216 
             L 250 160 
             L 250 96 
             L 200 68 Z" fill="url(#tealGrad)" />

    <!-- Casa Interna / Edificio - Mitad Izquierda (Azul) -->
    <path d="M 200 96 
             L 162 118 
             L 162 174 
             L 178 192 
             L 178 130 
             L 200 117 Z" fill="url(#blueGrad)" />

    <!-- Casa Interna / Edificio - Mitad Derecha (Turquesa) -->
    <path d="M 200 96 
             L 238 118 
             L 238 174 
             L 222 192 
             L 222 130 
             L 200 117 Z" fill="url(#tealGrad)" />

    <!-- Ventana central de 4 paneles (Detalle del primer logo) -->
    <g fill="#0072E5">
      <rect x="190" y="142" width="8" height="8" rx="1.5" />
      <rect x="202" y="142" width="8" height="8" rx="1.5" />
      <rect x="190" y="154" width="8" height="8" rx="1.5" />
      <rect x="202" y="154" width="8" height="8" rx="1.5" />
    </g>
  </g>

  <!-- ================= TIPOGRAFÍA: INNOVER ================= -->
  <text x="200" y="365" font-family="&#39;Montserrat&#39;, &#39;Inter&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#0F295A" text-anchor="middle" letter-spacing="-1.5">Innover</text>
</svg>